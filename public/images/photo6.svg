<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b8b4b0"/>
      <stop offset="100%" style="stop-color:#8c8884"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8c4c0;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#9a9692;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d0ccC8;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#8c8884;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Abstract geometric shapes -->
  <circle cx="400" cy="300" r="220" fill="none" stroke="#a0a09c" stroke-width="1" opacity="0.4"/>
  <circle cx="400" cy="300" r="160" fill="none" stroke="#a0a09c" stroke-width="1" opacity="0.35"/>
  <circle cx="400" cy="300" r="100" fill="none" stroke="#a0a09c" stroke-width="1" opacity="0.3"/>
  <!-- Diagonal lines -->
  <line x1="0" y1="0" x2="800" y2="600" stroke="#9a9692" stroke-width="1" opacity="0.25"/>
  <line x1="800" y1="0" x2="0" y2="600" stroke="#9a9692" stroke-width="1" opacity="0.25"/>
  <line x1="400" y1="0" x2="400" y2="600" stroke="#9a9692" stroke-width="0.75" opacity="0.2"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#9a9692" stroke-width="0.75" opacity="0.2"/>
  <!-- Overlapping shapes -->
  <rect x="250" y="150" width="300" height="300" fill="url(#g1)" opacity="0.4"/>
  <rect x="200" y="200" width="400" height="200" fill="url(#g2)" opacity="0.3" transform="rotate(15 400 300)"/>
  <!-- Central point -->
  <circle cx="400" cy="300" r="6" fill="#8a8882" opacity="0.6"/>
  <text x="400" y="570" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a4846" opacity="0.75" letter-spacing="6">ABSTRACT</text>
  <text x="400" y="590" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#5a5654" opacity="0.65" letter-spacing="3">STUDIO · 2021</text>
</svg>
