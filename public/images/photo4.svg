<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b0aeb8"/>
      <stop offset="100%" style="stop-color:#888690"/>
    </linearGradient>
    <linearGradient id="reflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#888690;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#b0aeb8;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Horizon -->
  <rect x="0" y="300" width="800" height="300" fill="url(#reflection)"/>
  <!-- Skyline silhouettes -->
  <rect x="30"  y="220" width="40" height="80" fill="#7a7880" opacity="0.5"/>
  <rect x="90"  y="180" width="50" height="120" fill="#7a7880" opacity="0.5"/>
  <rect x="160" y="140" width="35" height="160" fill="#7a7880" opacity="0.55"/>
  <rect x="210" y="200" width="45" height="100" fill="#7a7880" opacity="0.45"/>
  <rect x="280" y="160" width="60" height="140" fill="#7a7880" opacity="0.5"/>
  <rect x="360" y="100" width="40" height="200" fill="#6e6c74" opacity="0.6"/>
  <rect x="420" y="150" width="55" height="150" fill="#7a7880" opacity="0.5"/>
  <rect x="500" y="170" width="45" height="130" fill="#7a7880" opacity="0.48"/>
  <rect x="565" y="190" width="70" height="110" fill="#7a7880" opacity="0.45"/>
  <rect x="660" y="160" width="50" height="140" fill="#7a7880" opacity="0.5"/>
  <rect x="730" y="200" width="40" height="100" fill="#7a7880" opacity="0.45"/>
  <!-- Water ripples -->
  <ellipse cx="400" cy="450" rx="300" ry="8" fill="none" stroke="#9a98a2" stroke-width="1" opacity="0.3"/>
  <ellipse cx="400" cy="490" rx="250" ry="6" fill="none" stroke="#9a98a2" stroke-width="1" opacity="0.25"/>
  <ellipse cx="400" cy="525" rx="200" ry="5" fill="none" stroke="#9a98a2" stroke-width="1" opacity="0.2"/>
  <text x="400" y="570" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#4a4850" opacity="0.75" letter-spacing="6">CITYSCAPE</text>
  <text x="400" y="590" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#5a5860" opacity="0.65" letter-spacing="3">PARIS · 2022</text>
</svg>
