<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elie Rouphael — Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="nav-logo"><a href="index.html">ER</a></div>
      <div class="nav-title"><a href="index.html">Elie Rouphael</a></div>
      <button class="nav-toggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="index.html">Bio</a></li>
        <li><a href="research.html">Research</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="suggested-reads.html">Suggested Reads</a></li>
        <li><a href="photography.html">Photography</a></li>
      </ul>
      <div class="nav-search">
        <button aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
        </button>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <div class="page-title">
        <h1>Photography</h1>
      </div>

      <div class="gallery-grid">

        <div class="gallery-item">
          <img src="images/photo1.svg" alt="Lille, France" />
          <p class="gallery-caption">Lille, France — 2024</p>
        </div>

        <div class="gallery-item">
          <img src="images/photo2.svg" alt="Architecture" />
          <p class="gallery-caption">Architecture — Brussels, 2023</p>
        </div>

        <div class="gallery-item">
          <img src="images/photo3.svg" alt="Nature" />
          <p class="gallery-caption">Nature — Ardennes, 2023</p>
        </div>

        <div class="gallery-item">
          <img src="images/photo4.svg" alt="Cityscape" />
          <p class="gallery-caption">Cityscape — Paris, 2022</p>
        </div>

        <div class="gallery-item">
          <img src="images/photo5.svg" alt="Portraits" />
          <p class="gallery-caption">Portraits — Lille, 2022</p>
        </div>

        <div class="gallery-item">
          <img src="images/photo6.svg" alt="Abstract" />
          <p class="gallery-caption">Abstract — Studio, 2021</p>
        </div>

      </div>
    </div>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo lightbox">
    <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
    <button class="lightbox-prev" aria-label="Previous photo">&#8249;</button>
    <img class="lightbox-img" src="" alt="" />
    <p class="lightbox-caption"></p>
    <button class="lightbox-next" aria-label="Next photo">&#8250;</button>
  </div>

  <footer>
    <p>&copy; 2025 Elie Rouphael · University of Lille</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
