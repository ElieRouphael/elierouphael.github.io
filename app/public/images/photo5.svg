<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#cac6c2"/>
      <stop offset="100%" style="stop-color:#a8a49e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#d4d0cc;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#706c68;stop-opacity:0.35"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#vignette)"/>
  <!-- Portrait silhouette -->
  <circle cx="400" cy="210" r="95" fill="#9a9690" opacity="0.6"/>
  <ellipse cx="400" cy="480" rx="160" ry="130" fill="#9a9690" opacity="0.55"/>
  <!-- Subtle frame -->
  <rect x="80" y="60" width="640" height="480" fill="none" stroke="#8a8680" stroke-width="1.5" opacity="0.3"/>
  <rect x="90" y="70" width="620" height="460" fill="none" stroke="#8a8680" stroke-width="0.75" opacity="0.2"/>
  <text x="400" y="570" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#5a5652" opacity="0.75" letter-spacing="6">PORTRAITS</text>
  <text x="400" y="590" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#6a6660" opacity="0.65" letter-spacing="3">LILLE · 2022</text>
</svg>
