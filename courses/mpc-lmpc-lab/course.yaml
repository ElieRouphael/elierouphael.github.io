# Advanced MPC and Learning MPC: the course manifest.
# Chapter pages are rendered from chapters/<id>.md by scripts/build_mpc_course.py.
name: Advanced MPC and Learning MPC
folder: mpc-lmpc-lab
author: Elie Rouphael
license: MIT licensed.
# the course package, for the `::: code` snippets (functions quoted from its source)
package_root: C:/Users/rouphaee/Documents/PostDoc_v2/advanced_mpc_lmpc_lab/advanced_mpc_lmpc_lab/src

parts:
  - key: A
    title: Concepts
    lede: >-
      One idea per chapter, each on the same constrained double integrator: what the idea says in plain words
      and precisely, a live demo, the function of the course package that computes it read line by line,
      exercises whose solutions run, and a script that reproduces every number on the page.
  - key: B
    title: Labs
    lede: >-
      The concepts assembled into complete designs: a collision-avoidance decision, Learning MPC on a
      repeated task, minimum-time racing, local models learned from laps, the dynamic-programming view
      that connects MPC to reinforcement learning, and one design checked end to end.

  - key: C
    title: Beyond the nominal case
    lede: >-
      What the concept chapters assumed away, one chapter each: a bounded disturbance and the tube that
      absorbs it, a setpoint and the disturbance model that removes the steady-state offset, a nonlinear plant
      handled by linearising along the plan, and the racing controller that closes the loop with everything
      the labs built.

chapters:
  - id: a01
    slug: a01-state-space-models-and-the-double-integrator
    title: State-space models and the double integrator
    short: State-space models and the double integrator
    build: States, inputs, the four model classes, the course's double integrator and its two discretisations, and why the plant and the prediction model are different things.
    result: ""
    needs: Needs linear algebra and the idea of a derivative
  - id: a02
    slug: a02-prediction-matrices-and-condensing
    title: Prediction matrices and condensing
    short: Prediction matrices and condensing
    build: The stacked prediction identity, the condensed quadratic program it produces, and the sparse form that keeps the states as variables.
    result: ""
    needs: Needs chapter A1
  - id: a03
    slug: a03-convexity-qps-and-kkt
    title: Convexity, quadratic programs and the KKT conditions
    short: Convexity, QPs and KKT
    build: Convex sets and functions, the Lagrangian, duality, the four KKT conditions, and multipliers as the price of a constraint.
    result: ""
    needs: Needs linear algebra and multivariable calculus
  - id: a04
    slug: a04-solving-a-qp-you-can-read
    title: Solving a QP you can read
    short: Solving a QP you can read
    build: The course's own interior-point solver, sixty lines of NumPy read line by line, against SciPy's SLSQP on the course's problems.
    result: ""
