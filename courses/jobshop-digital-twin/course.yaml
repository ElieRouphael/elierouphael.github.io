# Which Job Should the Machine Do Next?: the course manifest.
# Chapter pages are rendered from chapters/<id>.md by scripts/build_jobshop_course.py.
# Authors: read AUTHORING.md and notation.md first.
name: Which Job Should the Machine Do Next?
folder: jobshop-digital-twin
author: Elie Rouphael
license: MIT licensed.
# the repository, for the `::: code` snippets (paths below are relative to it, e.g. jobshop/cpsat.py:solve_snapshot)
package_root: C:/Users/rouphaee/Documents/PostDoc_v2/jobshop-digital-twin
# the shared demo toolkit, public/tutorials/jobshop-digital-twin/interactive/jobshop-lib.js
lib: jobshop-lib.js

parts:
  - key: A
    title: Scheduling problems
    lede: >-
      What a schedule is and how to measure one, why a simple rule is sometimes provably the best possible and
      sometimes cannot be, and the flexible job shop this course is about, written down precisely.
  - key: B
    title: Simulating the shop
    lede: >-
      A workshop you cannot experiment on, replaced by one you can: a discrete-event simulation with random
      orders and breakdowns, and the dispatching rules a real shop would run on it.
  - key: C
    title: Optimising
    lede: >-
      The same decisions taken by a model: a constraint-programming formulation of the shop, how the solver finds
      and proves a plan, and how re-planning at every event turns one plan into a controller.
  - key: D
    title: Learning, and judging the evidence
    lede: >-
      A reinforcement-learning agent that learns which rule to apply, and the statistics and checks that decide
      whether one method really beats another.

chapters:
  - id: a01
    slug: a01-what-a-schedule-is
    title: What a schedule is
    short: What a schedule is
    build: Jobs, machines and time; the Gantt chart; completion, lateness, tardiness, flow time and makespan; Graham's three-field notation and where this course's problem sits in it.
    result: ""
    needs: Needs nothing beyond arithmetic
  - id: a02
    slug: a02-one-machine-when-rules-are-optimal
    title: "One machine: when a rule is optimal, and when it cannot be"
    short: When a rule is optimal
    build: The paint-shop example; exchange arguments proving that shortest-job-first minimises total completion time and most-urgent-first the worst lateness; why total tardiness is NP-hard; changeovers as a travelling-salesman problem; counting sequences.
    result: ""
    needs: Needs chapter A1
  - id: a03
    slug: a03-the-flexible-job-shop
    title: The flexible job shop
    short: The flexible job shop
    build: Operations, routings and eligible machines; precedence and machine capacity; the disjunctive graph, in which a schedule is an acyclic orientation and the makespan a longest path; the course's workshop, in numbers.
    result: ""
    needs: Needs chapters A1 and A2
  - id: b01
    slug: b01-discrete-event-simulation
    title: Discrete-event simulation
    short: Discrete-event simulation
    build: The event list and the simulation clock; Poisson arrivals and the memoryless exponential; load and availability computed by hand; breakdowns and repairs; SimPy processes; what the simulator decides and what it leaves to a controller.
    result: ""
    needs: Needs chapter A3 and the exponential distribution
  - id: b02
    slug: b02-dispatching-rules-in-a-dynamic-shop
    title: Dispatching rules in a dynamic shop
    short: Dispatching rules
    build: Rules as priority indices; routing by earliest expected finish; rerouting after a breakdown; the four rules on twenty simulated days; the composite ATCS rule as a stronger baseline.
    result: ""
    needs: Needs chapters A2 and B1
  - id: c01
    slug: c01-a-constraint-programming-model
    title: A constraint-programming model of the shop
    short: A constraint-programming model
    build: Decision variables; optional intervals and exactly-one routing; NoOverlap; the circuit constraint carrying sequence-dependent changeovers; precedence with transport lags; tardiness made linear; the objective; the same problem as a big-M MILP.
    result: ""
    needs: Needs chapter A3 and linear inequalities
  - id: c02
    slug: c02-how-cp-sat-finds-and-proves-a-plan
    title: How CP-SAT finds and proves a plan
    short: How CP-SAT finds and proves a plan
    build: Propagation, search and learned clauses in plain terms; lower and upper bounds and the optimality gap; large neighbourhood search; warm starts and hints; deterministic time and reproducible runs.
    result: ""
    needs: Needs chapter C1
  - id: c03
    slug: c03-rescheduling-on-a-rolling-horizon
    title: Rescheduling on a rolling horizon
    short: Rescheduling on a rolling horizon
    build: The snapshot of a running shop and what is frozen; event-driven re-planning; executing only the beginning of each plan; the 25-job cap; greedy list scheduling as warm start and ablation; myopia and nervousness.
    result: ""
    needs: Needs chapters B1 and C2
  - id: d01
    slug: d01-dispatching-as-reinforcement-learning
    title: Dispatching as reinforcement learning
    short: Dispatching as reinforcement learning
    build: The Markov decision process of a dispatcher; a reward whose sum is exactly minus the total tardiness; Bellman's equation, Q-learning and the Double DQN; why choosing among four rules bounds what the agent can achieve.
    result: ""
    needs: Needs chapters B2 and C3, and expected values
  - id: d02
    slug: d02-a-fair-benchmark
    title: A fair benchmark
    short: A fair benchmark
    build: Common random numbers and paired differences; the percentile bootstrap; training, validation and test separation; the optimism of choosing the best rule after the test; the independent checker as executable invariants.
    result: ""
    needs: Needs chapters B2, C3 and D1, and basic probability
